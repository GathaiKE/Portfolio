<div class="w-fit bottom-10 left-24 bg-primary-darker rounded-lg p-2 fixed text-sm">
    <div class="flex flex-row gap-3 items-center" *ngIf="status">
        <img src="../../../assets/ok.png" alt="" class="w-6 h-6">
        <p class="w-fit inline-block text-center text-cyan">{{message}}</p>
    </div>
    <div class="flex flex-row gap-3 items-center" *ngIf="!status">
        <img src="../../../assets/failed.png" alt="" class="w-6 h-6">
        <p class="w-fit inline-block text-center text-red-500">{{message}}</p>
    </div>
</div>
