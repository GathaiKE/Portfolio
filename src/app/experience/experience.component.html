<app-header></app-header>
<div class="flex">
    <app-socials class="fixed -z-10"></app-socials>

    <div class="w-full min-h-screen bg-primary-light py-20 lg:ml-40 text-white">
        <h2 class="md:text-xl text-base 
        text-cyan font-bold">Experience</h2>
        <div class="flex flex-col ml-5 gap-3 mt-3">
            <select
                class="h-fit bg-primary-light text-base md:text-lg active:border-l-2 border-cyan active:text-cyan cursor-pointer px-4 w-fit flex-col md:flex-row border-none outline-none"
                (change)="nextJob($event)">
                <option *ngFor="let job of experience" [value]="job.id">
                    {{ job.company }}
                </option>
            </select>
            <app-detail [job$]="activeJob$"></app-detail>
        </div>
    </div>

    <app-side-component></app-side-component>
</div>
<app-footer></app-footer>
